<div class="row">
    <div class="col-md-5">
        <!-- Add tag to load the Document List component -->
        <app-document-list
            (selectedDocumentEvent)="selectedDocument = $event">
        </app-document-list>
    </div>

    <div class="col-md-4">
        <!-- Add tag to load the Document Detail component -->
        <app-document-detail
            *ngIf="selectedDocument; else noDocument"
            [document]="selectedDocument"
        ></app-document-detail>

        <ng-template #noDocument>
            <p>Please select a Document.</p>
        </ng-template>
    </div>
</div>
