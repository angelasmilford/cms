<div class="row">
    <div class="col-xs-12 col-md-6">
        <h2>Edit User</h2>

        <form (ngSubmit)="onSubmit(f)" #f="ngForm">
            <div class="form-group">
                <label>Username</label>

                <input
                    class="form-control"
                    [(ngModel)]="user.username"
                    name="username"
                >
            </div>

            <div class="form-group">
                <label>Email</label>

                <input
                    class="form-control"
                    [(ngModel)]="user.email"
                    name="email"
                >
            </div>

            <div class="form-group">
                <label>Role</label>

                <select
                    class="form-control"
                    [(ngModel)]="user.role"
                    name="role">

                    <option value="user">User</option>
                    <option value="admin">Admin</option>
                </select>
            </div>

            <br>

            <button
                class="btn btn-primary"
                type="submit"
            >
                Save
            </button>
        </form>
    </div>
</div>
