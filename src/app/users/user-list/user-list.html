<div class="row">
    <div class="col-xs-12">
        <h2>Users</h2>

        <button
            class="btn btn-success"
            routerLink="/register">

            New User
        </button>

        <hr>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th></th>
                </tr>
            </thead>

            <tbody>
                <tr *ngFor="let user of users">
                    <td>{{ user.username }}</td>
                    <td>{{ user.email }}</td>
                    <td>{{ user.role }}</td>

                    <td>
                        <button
                            class="btn btn-primary btn-sm"
                            (click)="editUser(user)">

                            Edit
                        </button>

                        <button
                            class="btn btn-danger btn-sm"
                            (click)="deleteUser(user)">

                            Delete
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
