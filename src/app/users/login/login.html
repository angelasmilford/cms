<div class="row">
    <div class="col-xs-12 col-md-6 col-md-offset-3">
        <h2>Login</h2>

        <form (ngSubmit)="onLogin()">
            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    class="form-control"
                    [(ngModel)]="email"
                    name="email"
                required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                [type]="showPassword ? 'text' : 'password'"
                class="form-control"
                [(ngModel)]="password"
                name="password"
                required>

                <div class="checkbox">
                    <label>
                        <input 
                            type="checkbox"
                            [(ngModel)]="showPassword"
                            name="showPassword">
                        Show Password
                    </label>
                </div>
            </div>

            <br>

            <button
                class="btn btn-primary"
                type="submit">
                Login
            </button>

            <hr>

            <p>
                Don't have an account?
                <a routerLink="/register">Create one here</a>
            </p>
        </form>
    </div>
</div>
