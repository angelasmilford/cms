<div class="row">
    <div class="col-xs-12 col-md-6 col-md-offset-3">
        <h2>Create Account</h2>

        <form (ngSubmit)="onRegister()">
            <div class="form-group">
                <label>Username</label>
                <input
                    type="text"
                    class="form-control"
                    [(ngModel)]="username"
                    name="username">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    class="form-control"
                    [(ngModel)]="email"
                    name="email">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    class="form-control"
                    [(ngModel)]="password"
                    name="password">
            </div>

            <div class="form-group">
                <label>Role</label>

                <select
                    class="form-control"
                    [(ngModel)]="role"
                    name="role">

                    <option value="user">User</option>
                    <option value="admin">Admin</option>
                </select>
            </div>

            <br>

            <button
                class="btn btn-success"
                type="submit">
                Register
            </button>

            <hr>

            <p>
                Already have an account?
                <a routerLink="/login">Login here</a>
            </p>
        </form>
    </div>
</div>
