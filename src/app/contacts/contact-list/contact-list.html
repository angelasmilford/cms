<div class="row">
    <div class="col-xs-12">

        <div class="panel panel-default">
            <!-- Header -->
            <div class="panel-heading">
                <div class="row">
                    <div class="col-xs-6">
                        <h2 class="panel-title"><strong>Contacts</strong></h2>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-xs-8">
                        <!-- Add the search box input field here -->
                        <div 
                            class="input-group" 
                            (click)="search(searchBox.value)"
                        >
                            <input
                                type="text"
                                class="form-control"
                                placeholder="Enter a search value"
                                #searchBox
                                (keyup)="search(searchBox.value)"
                            >

                            <span
                                class="input-group-addon glyphicon glyphicon-search"
                                (click)="search(searchBox.value)"
                            ></span>
                        </div>
                    </div>
                    
                    <div class="col-xs-4 text-right">
                        <a 
                            class="btn btn-success" 
                            [routerLink]="['new']"
                        >New Contact</a>
                    </div>
                </div>
            </div>

            <!-- Contact List -->
            <div class="panel-body">
                <div class="list-group"> <!-- list-group-item -->
                    <app-contact-item 
                        *ngFor="let contactEl of contacts | contactsFilter: term"
                        [contact]="contactEl"
                    >
                    </app-contact-item>
                </div>
            </div>
        </div>
    </div>
</div>
