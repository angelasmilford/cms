<div class="panel panel-default">

    <!-- Contact Selected -->
    <div class="panel-default">
        <!-- Header -->
        <div class="panel-heading">

            <!-- Name Row -->
            <div class="row">
                <div class="col-xs-12">
                    <h2>{{ contact.name }}</h2>
                </div>

            </div>

            <br>

            <!-- Image + Buttons Row -->
            <div class="row">
                <!-- Image -->
                <div class="col-xs-4">
                    <img
                        [src]="contact.imageUrl"
                        class="img-responsive"
                        style="width: 80px;"
                    >
                </div>

                <!-- Buttons -->
                <div class="col-xs-8 text-right">
                    <br>
                    
                    <a
                        class="btn btn-primary"
                        style="margin-right: 5px;"
                        (click)="onEditContact()"
                    >
                        Edit
                    </a>

                    <a class="btn btn-danger">
                        Delete
                    </a>
                </div>
            </div>
        </div>

        <!-- Body -->
        <div class="panel-body">
            <p>
                <strong>Email:</strong>
                {{ contact.email }}
            </p>

            <p>
                <strong>Phone:</strong>
                {{ contact.phone }}
            </p>
        </div>
    </div>
</div>
