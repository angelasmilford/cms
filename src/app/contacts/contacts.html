<div class="row">
    <!-- Contact List -->
    <div class="col-md-5">
        <app-contact-list></app-contact-list>
    </div>

    <!-- Contact Detail -->
    <div class="col-md-4">
        <app-contact-detail 
            *ngIf="selectedContact; else noContact"
            [contact]="selectedContact"
        >
        </app-contact-detail>

        <ng-template #noContact>
            <p>Please select a Contact.</p>
        </ng-template>
    </div>
</div>
